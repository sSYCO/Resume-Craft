<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder | ResumeCraft</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/builder.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Your Custom Scripts -->
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-flow.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="logo">Resume<span>Craft</span></div>
        <div class="nav-links" id="nav-links">
            <a href="/index.html" class="btn btn-outline" id="mobile-view">Home</a>
        </div>
        <div class="nav-actions">
            <button id="theme-toggle" aria-label="Toggle Theme"><i class="fa-regular fa-moon"></i></button>
            <button class="btn btn-outline" id="logout-btn">Logout</button>
        </div>
    </nav>

    <main class="builder-container">
        <aside class="form-panel fade-right">
            <h2>Fill Your Details</h2>
            <form id="resume-form">
                <div class="section">
                    <label>Profile Photo (Required)</label>
                    <input type="file" id="photo-upload" accept="image/*" required>
                    <div id="photo-preview" class="photo-box"></div>
                </div>

                <div class="section">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="section">
                    <label>Professional Title</label>
                    <input type="text" id="title" placeholder="Software Engineer">
                </div>

                <!-- Contact Information -->
                <div class="section">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="section">
                    <label>Phone</label>
                    <input type="tel" id="phone" placeholder="+92 300 1234567">
                </div>
                <div class="section">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="City, Country">
                </div>
                <div class="section">
                    <label>LinkedIn / Portfolio (Optional)</label>
                    <input type="text" id="linkedin" placeholder="linkedin.com/in/yourname">
                </div>
                <div class="section">
                    <label>Summary</label>
                    <textarea id="summary" rows="3" placeholder="2-3 lines about your expertise..."></textarea>
                </div>

                <div class="section" id="edu-section">
                    <label>Education</label>
                    <div class="dynamic-entry">
                        <input type="text" class="edu-degree" placeholder="Degree (e.g., BS CS)">
                        <input type="text" class="edu-inst" placeholder="Institution">
                        <button type="button" class="btn-remove">✖</button>
                    </div>
                    <button type="button" class="btn-add" id="add-edu">+ Add Education</button>
                </div>

                <div class="section" id="exp-section">
                    <label>Experience</label>
                    <div class="dynamic-entry">
                        <input type="text" class="exp-role" placeholder="Role">
                        <input type="text" class="exp-company" placeholder="Company">
                        <button type="button" class="btn-remove">✖</button>
                    </div>
                    <button type="button" class="btn-add" id="add-exp">+ Add Experience</button>
                </div>

                <div class="section" id="skills-section">
                    <label>Skills (comma separated)</label>
                    <input type="text" id="skills" placeholder="JavaScript, React, Node.js, Figma">
                </div>
            </form>
        </aside>

        <section class="preview-panel fade-left">
            <div class="preview-controls">
                <select id="template-select">
                    <option value="1">Template 1: Classic</option>
                    <option value="2">Template 2: Minimal</option>
                    <option value="3">Template 3: Modern</option>
                    <option value="4">Template 4: Creative</option>
                    <option value="5">Template 5: Executive</option>
                    <option value="6">Template 6: ATS Pro</option>
                </select>
                <button class="btn btn-primary" id="download-pdf">📥 Download PDF</button>
            </div>
            <div id="resume-preview" class="a4-preview"></div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-flow.js"></script>
    <script src="js/builder-core.js"></script>
    <script src="js/theme-toggle.js"></script>
</body>

</html>
