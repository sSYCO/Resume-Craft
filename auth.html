<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ResumeCraft</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Resume<span>Craft</span></div>
        
        <div class="nav-links" id="nav-links">
            <a href="https://ssyco.github.io/Resume-Craft/" class="btn btn-outline">Back To Home</a>
        </div>

        <div class="nav-actions">
            <button id="theme-toggle" aria-label="Toggle Theme"><i class="fa-regular fa-moon"></i></button>
    </nav>

    <div class="auth-container">
        <div class="auth-box fade-up">
            <h2 id="auth-title">Login to ResumeCraft</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" id="auth-btn">Login</button>
            </form>
            <p class="switch-text">
                <span id="switch-msg">Don't have an account?</span>
                <a href="#" id="switch-link">Signup</a>
            </p>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-flow.js"></script>
    <script src="js/theme-toggle.js"></script>
</body>
</html>
